name: Cross Compile to Windows
on:
    push:
        branches: ["master"]
        paths-ignore:
            - src/.build-number
    workflow_run:
        workflows: ["Version Increment"]
        types: ["completed"]

env:
    CROSS_TRIPLE: x86_64-w64-mingw32

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                submodules: recursive

            - name: Set up build environment
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake libgtest-dev mingw-w64
                  # Default mingw uses win32 threads: <mutex>/<condition_variable>
                  # broken. Switch to posix variant.
                  sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
                  sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

            - name: Configure
              run: |
                  cmake -S . -B build \
                    -DCMAKE_SYSTEM_NAME=Windows \
                    -DCMAKE_C_COMPILER=${CROSS_TRIPLE}-gcc \
                    -DCMAKE_CXX_COMPILER=${CROSS_TRIPLE}-g++ \
                    -DCMAKE_CXX_FLAGS="-static -static-libgcc -static-libstdc++" \
                    -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

            - name: Build
              run: cmake --build build

            - name: Read build number from file
              id: getbuildno
              run: |
                echo "buildno=$(cat src/.build-number)" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@v4
              with:
                name: oneway-v1.1.${{ steps.getbuildno.outputs.buildno }}-windows-x64
                path: build/oneway.exe
