name: Cross Compile to armv7l (32 bit)
on:
    push:
        branches: ["master", "build-pizero"]
        paths-ignore:
            - src/.build-number
    workflow_run:
        workflows: ["Version Increment"]
        types: ["completed"]

env:
    CROSS_TRIPLE: arm-linux-gnueabihf

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                submodules: recursive

            - name: Set up build environment
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake libgtest-dev binutils-arm-linux-gnueabihf g++-arm-linux-gnueabihf

            - name: Configure
              run: |
                  cmake -S . -B build \
                    -DCMAKE_SYSTEM_NAME=Linux \
                    -DCMAKE_SYSTEM_PROCESSOR=arm \
                    -DCMAKE_C_COMPILER=${CROSS_TRIPLE}-gcc \
                    -DCMAKE_CXX_COMPILER=${CROSS_TRIPLE}-g++ \
                    -DCMAKE_CXX_FLAGS="-static -DCRYPTOPP_DISABLE_ARM_NEON"

            - name: Build
              run: cmake --build build

            - name: Read build number from file
              id: getbuildno
              run: |
                  echo "buildno=$(cat src/.build-number)" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-artifact@v4
              with:
                name: oneway-v1.1.${{ steps.getbuildno.outputs.buildno }}-armv7l
                path: build/oneway
